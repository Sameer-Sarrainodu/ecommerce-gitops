apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ingress-nginx
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.13.0

    helm:
      values: |
        controller:
          replicaCount: 2
          service:
            annotations:
              # CRITICAL: Forces AKS to automatically create the NSG rule with Destination: Any / VirtualNetwork
              service.beta.kubernetes.io/azure-allowed-service-ports: "80,443"
              # Fixes Port 80 health probes
              service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/healthz"
              # Fixes Port 443 health probes
              service.beta.kubernetes.io/azure-load-balancer-health-probe-num-of-probes: "2"

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
    - CreateNamespace=true