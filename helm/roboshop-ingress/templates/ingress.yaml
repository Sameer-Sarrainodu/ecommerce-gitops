apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: roboshop
  annotations:
    argocd.argoproj.io/sync-wave: "4"

spec:

  ingressClassName: nginx

  rules:

  - host: shop.sharkdev.shop

    http:

      paths:

      - path: /
        pathType: Prefix

        backend:
          service:
            name: frontend
            port:
              number: 80