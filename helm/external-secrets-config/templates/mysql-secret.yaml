apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
  name: mysql-secret
  namespace: roboshop

  annotations:
    argocd.argoproj.io/sync-wave: "-1"

spec:

  refreshInterval: 1h

  secretStoreRef:
    name: azure-keyvault
    kind: SecretStore

  target:
    name: mysql-secret

  data:

  - secretKey: root-password

    remoteRef:
      key: mysql-password