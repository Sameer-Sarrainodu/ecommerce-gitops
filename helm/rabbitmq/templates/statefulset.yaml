apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: rabbitmq
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  serviceName: rabbitmq-headless

  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: rabbitmq

  template:
    metadata:
      labels:
        app: rabbitmq

    spec:
      containers:

      - name: rabbitmq

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        imagePullPolicy: {{ .Values.image.pullPolicy }}

        ports:
        - containerPort: 5672

        - containerPort: 15672

        env:

        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: username

        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: password

        readinessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - ping
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        livenessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - ping
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

        volumeMounts:
        - name: rabbitmq-storage
          mountPath: /var/lib/rabbitmq

  volumeClaimTemplates:

  - metadata:
      name: rabbitmq-storage

    spec:
      storageClassName: managed-csi

      accessModes:
      - ReadWriteOnce

      resources:

        requests:
          storage: {{ .Values.storage.size }}