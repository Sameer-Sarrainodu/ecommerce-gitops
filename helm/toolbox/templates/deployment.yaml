apiVersion: apps/v1
kind: Deployment

metadata:
  name: toolbox
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: toolbox

  template:
    metadata:
      labels:
        app: toolbox

    spec:
      containers:
      - name: toolbox

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        imagePullPolicy: {{ .Values.image.pullPolicy }}

        command:
        - sleep

        args:
        - infinity

        resources:
          requests:
            cpu: 50m
            memory: 64Mi

          limits:
            cpu: 200m
            memory: 256Mi