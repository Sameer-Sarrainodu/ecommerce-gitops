apiVersion: apps/v1
kind: Deployment

metadata:
  name: catalogue
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:

  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: catalogue

  template:

    metadata:
      labels:
        app: catalogue

    spec:

      containers:

      - name: catalogue

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        imagePullPolicy: {{ .Values.image.pullPolicy }}

        ports:
        - containerPort: 8080

        env:
        - name: MONGO_URL
          value: "{{ .Values.env.MONGO_URL }}"

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5