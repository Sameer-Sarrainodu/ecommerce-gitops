apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mongodb
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  serviceName: mongodb-headless

  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
      - name: mongodb

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        imagePullPolicy: {{ .Values.image.pullPolicy }}

        ports:
        - containerPort: 27017

        readinessProbe:
          exec:
            command:
            - mongosh
            - --quiet
            - --eval
            - db.runCommand({ ping: 1 })
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        livenessProbe:
          exec:
            command:
            - mongosh
            - --quiet
            - --eval
            - db.runCommand({ ping: 1 })
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

        volumeMounts:
        - name: mongodb-storage
          mountPath: /data/db

  volumeClaimTemplates:
  - metadata:
      name: mongodb-storage

    spec:
      accessModes:
      - ReadWriteOnce

      resources:
        requests:
          storage: {{ .Values.storage.size }}