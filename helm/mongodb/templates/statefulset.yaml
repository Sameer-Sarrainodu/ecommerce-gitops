apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mongodb

  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:

  serviceName: mongodb-headless

  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:

    metadata:
      labels:
        app: mongodb

    spec:

      containers:

      - name: mongodb

        image: mongo:7.0

        ports:
        - containerPort: 27017

        volumeMounts:
        - name: mongodb-storage
          mountPath: /data/db

  volumeClaimTemplates:

  - metadata:
      name: mongodb-storage

    spec:

      storageClassName: managed-csi

      accessModes:
      - ReadWriteOnce

      resources:
        requests:
          storage: 10Gi