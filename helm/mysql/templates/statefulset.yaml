apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mysql

  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:

  serviceName: mysql-headless

  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:

    metadata:
      labels:
        app: mysql

    spec:

      containers:

      - name: mysql

        image: mysql:5.7

        env:

        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: root-password

        ports:
        - containerPort: 3306

        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - mysqladmin ping -uroot -p${MYSQL_ROOT_PASSWORD}

        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - mysqladmin ping -uroot -p${MYSQL_ROOT_PASSWORD}

        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql

  volumeClaimTemplates:

  - metadata:
      name: mysql-storage

    spec:

      storageClassName: managed-csi

      accessModes:
      - ReadWriteOnce

      resources:
        requests:
          storage: 10Gi