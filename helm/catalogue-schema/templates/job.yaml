apiVersion: batch/v1
kind: Job

metadata:
  name: catalogue-schema

  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:

  backoffLimit: 1

  template:

    spec:

      restartPolicy: Never

      containers:

      - name: catalogue-schema

        image: sameerroboshopacr.azurecr.io/catalogue-schema:v1

        command:
        - sh
        - -c
        - |
          until nc -z mongodb 27017
          do
            echo "waiting for mongodb"
            sleep 5
          done

          mongosh mongodb/catalogue /init.js

          mongosh mongodb/catalogue /master-data.js